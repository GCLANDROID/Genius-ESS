apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.genius.employee"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 72
        versionName "8.2"//7.5
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        packagingOptions {
            exclude 'META-INF/DEPENDENCIES'
            exclude 'META-INF/LICENSE'
            exclude 'META-INF/LICENSE.txt'
            exclude 'META-INF/license.txt'
            exclude 'META-INF/NOTICE'
            exclude 'META-INF/NOTICE.txt'
            exclude 'META-INF/notice.txt'
            exclude 'META-INF/ASL2.0'
            exclude 'META-INF/INDEX.LIST'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    buildToolsVersion = '28.0.3'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.6.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    //noinspection GradleCompatible
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.12'
    //noinspection GradleCompatible
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'com.github.hajiyevelnur92:intentanimation:1.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    //noinspection GradleCompatible
    implementation 'com.google.android.gms:play-services-location:15.0.1'
    implementation 'com.google.android.gms:play-services-auth:15.0.1'
    implementation 'com.google.android.gms:play-services-maps:15.0.1'
    implementation 'com.google.android.gms:play-services-places:15.0.1'
    //noinspection GradleCompatible
    implementation 'com.android.support:recyclerview-v7:28.0.0-rc01'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.4.1'
    implementation 'com.squareup.okhttp3:okhttp:3.2.0'
    implementation 'com.squareup.okio:okio:1.7.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:cardview-v7:28.0.0-rc01'
    implementation 'com.jackandphantom.android:circularimageview:1.2.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:cardview-v7:28.0.0-rc01'
    //noinspection GradleCompatible
    implementation 'com.android.support:cardview-v7:28.0.0-rc01'
    implementation 'com.github.vipulasri.layouttoimage:library:1.0.0'
    implementation 'com.kyanogen.signatureview:signature-view:1.1'
    implementation 'com.github.amanjeetsingh150:ImageZipper:1.3'
    implementation 'com.amitshekhar.android:jackson-android-networking:1.0.2'
    //noinspection GradleCompatible
    implementation 'com.android.support:design:28.0.0'
    implementation project(path: ':dlib')
    implementation project(path: ':library')
    androidTestImplementation('com.android.support.test:runner:0.5') {
        exclude module: 'support-annotations'
    }

    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2') {
        exclude module: 'support-annotations'
    }
    implementation 'com.amitshekhar.android:jackson-android-networking:1.0.2'
    compile "com.squareup.picasso:picasso:2.4.0"
    implementation 'com.github.vipulasri.layouttoimage:library:1.0.0'
    implementation 'com.github.cdflynn:checkview:v1.1'
    implementation 'com.github.delight-im:Android-AdvancedWebView:v3.2.1'
    implementation 'com.github.barteksc:android-pdf-viewer:2.8.2'
    compile 'com.github.gcacace:signature-pad:1.3.1'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.10'
    implementation 'com.github.TutorialsAndroid:FilePicker:v4.0.19'
    implementation 'com.google.android.play:core:1.10.0'
    implementation 'com.github.douglasjunior:android-simple-tooltip:1.1.0'
    implementation 'com.github.dhimant1990:TimerTextView:v1.0'
    implementation 'com.github.yuriy-budiyev:code-scanner:2.3.2'

    //TODO: App permission
    implementation 'com.karumi:dexter:6.2.3'

    // CameraX core library
    implementation "androidx.camera:camera-core:1.1.0-alpha03"
    implementation "androidx.camera:camera-camera2:1.1.0-alpha03"

    // CameraX view class
    implementation "androidx.camera:camera-view:1.0.0-alpha31"

    // CameraX lifecycle library
    implementation "androidx.camera:camera-lifecycle:1.0.0-alpha31"

    /*def cameraVersion = "1.3.1"
    implementation("androidx.camera:camera-lifecycle:$cameraVersion")
    implementation("androidx.camera:camera-camera2:$cameraVersion")
    implementation("androidx.camera:camera-view:$cameraVersion")
    implementation("androidx.camera:camera-core:$cameraVersion")*/
}

